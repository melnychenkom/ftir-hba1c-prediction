[project]
name = "spectral-core"
version = "0.1.0"
description = ""
authors = [
    {name = "Mykola Melnychenko",email = "miko.melnychenko@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "boxsers (>=1.5.2,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.5.0,<7.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "brokenaxes (>=0.6.2,<0.7.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "lightning (>=2.6.0,<3.0.0)",
    "mlflow (>=3.7.0,<4.0.0)",
    "jsonargparse[signatures] (>=4.44.0,<5.0.0)",
    "jax (>=0.8.2,<0.9.0)",
    "jaxfit @ git+https://github.com/MelnychenkoM/jaxfit.git",
    "nbformat (>=4.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch_cpu"}
